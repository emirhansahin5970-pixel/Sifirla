<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" role="img" aria-label="Önizleme: kartopu ve çığ karşılaştırma ekranı">
  <rect width="320" height="680" fill="#0A1220"/>
  <text x="24" y="56" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#DCE7F4">Kartopu mu, çığ mı?</text>
  <!-- iki yöntem kartı -->
  <g font-family="-apple-system,sans-serif">
    <rect x="24" y="84" width="128" height="200" rx="14" fill="#111C2E" stroke="#243756"/>
    <text x="44" y="116" font-size="13" font-weight="700" fill="#DCE7F4">Kartopu</text>
    <text x="44" y="140" font-size="11" fill="#AEC0D6">en küçük borç</text>
    <rect x="44" y="176" width="88" height="10" rx="5" fill="#3A5C8C"/>
    <rect x="44" y="196" width="66" height="10" rx="5" fill="#2b3f5f"/>
    <rect x="44" y="216" width="48" height="10" rx="5" fill="#22344f"/>
    <text x="44" y="258" font-size="20" font-weight="700" fill="#DCE7F4">28 ay</text>

    <rect x="168" y="84" width="128" height="200" rx="14" fill="#111C2E" stroke="#7FA0C8"/>
    <text x="188" y="116" font-size="13" font-weight="700" fill="#DCE7F4">Çığ</text>
    <text x="188" y="140" font-size="11" fill="#AEC0D6">en yüksek faiz</text>
    <rect x="188" y="176" width="88" height="10" rx="5" fill="#E8D9B8"/>
    <rect x="188" y="196" width="60" height="10" rx="5" fill="#c9b98f"/>
    <rect x="188" y="216" width="40" height="10" rx="5" fill="#a68e58"/>
    <text x="188" y="258" font-size="20" font-weight="700" fill="#E8D9B8">25 ay</text>
  </g>
  <!-- erime eğrisi -->
  <rect x="24" y="308" width="272" height="180" rx="16" fill="#111C2E" stroke="#243756"/>
  <text x="44" y="336" font-family="-apple-system,sans-serif" font-size="12" fill="#AEC0D6">Erime eğrisi</text>
  <path d="M44 452 C120 448 150 420 180 380 C210 342 250 372 276 360" fill="none" stroke="#7FA0C8" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 452 C120 448 150 420 180 380 C210 342 250 372 276 360 L276 468 L44 468 Z" fill="#7FA0C8" opacity="0.08"/>
  <rect x="24" y="512" width="272" height="108" rx="16" fill="#111C2E" stroke="#243756"/>
  <rect x="44" y="536" width="150" height="11" rx="5.5" fill="#243756"/>
  <rect x="44" y="562" width="220" height="9" rx="4.5" fill="#182740"/>
  <rect x="44" y="580" width="190" height="9" rx="4.5" fill="#182740"/>
</svg>
