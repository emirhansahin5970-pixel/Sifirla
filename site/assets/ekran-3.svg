<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" role="img" aria-label="Önizleme: sadece asgari ödeme uyarısı ekranı">
  <rect width="320" height="680" fill="#0A1220"/>
  <text x="24" y="56" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#DCE7F4">Sadece asgari ödersem?</text>
  <!-- uyarı kartı -->
  <rect x="24" y="84" width="272" height="120" rx="16" fill="#2b1a15" stroke="#5c3a30"/>
  <path d="M52 148 l14 -26 14 26 z" fill="none" stroke="#E08573" stroke-width="3" stroke-linejoin="round"/>
  <line x1="66" y1="134" x2="66" y2="142" stroke="#E08573" stroke-width="3" stroke-linecap="round"/>
  <circle cx="66" cy="148" r="1.6" fill="#E08573"/>
  <rect x="96" y="112" width="176" height="11" rx="5.5" fill="#5c3a30"/>
  <rect x="96" y="134" width="150" height="9" rx="4.5" fill="#40251d"/>
  <text x="96" y="180" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#E08573">Bu borç hiç bitmez</text>
  <!-- faiz eğrisi düz gider -->
  <rect x="24" y="228" width="272" height="200" rx="16" fill="#111C2E" stroke="#243756"/>
  <text x="44" y="256" font-family="-apple-system,sans-serif" font-size="12" fill="#AEC0D6">Bakiye — sadece asgari</text>
  <path d="M44 300 C120 306 200 300 276 308" fill="none" stroke="#E08573" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
  <text x="44" y="340" font-family="-apple-system,sans-serif" font-size="11" fill="#AEC0D6">Bakiye — planla</text>
  <path d="M44 360 C130 356 170 384 220 396 C244 402 262 404 276 404" fill="none" stroke="#7FA0C8" stroke-width="3" stroke-linecap="round"/>
  <!-- sonuç satırı -->
  <rect x="24" y="452" width="272" height="168" rx="16" fill="#111C2E" stroke="#243756"/>
  <rect x="44" y="478" width="120" height="11" rx="5.5" fill="#243756"/>
  <rect x="44" y="506" width="228" height="9" rx="4.5" fill="#182740"/>
  <rect x="44" y="524" width="205" height="9" rx="4.5" fill="#182740"/>
  <rect x="44" y="560" width="180" height="34" rx="9" fill="#16283C"/>
